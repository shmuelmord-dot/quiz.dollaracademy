                        },
                            React.createElement('div', {
                                style: { maxWidth:448, margin:'0 auto', pointerEvents:'auto', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
                                    background:'#141A2E', border:'1px solid #26304D', borderRadius:16, padding:10, boxShadow:'0 -4px 24px rgba(0,0,0,0.5)' }
                            },
                                React.createElement('span', { style:{ color:'#F4F6FC', fontSize:14, fontWeight:700, fontFamily:'Assistant,sans-serif', paddingRight:8, paddingLeft:8 } }, '297 ₪ + מע״מ'),
                                React.createElement('a', { href:'#/diagnostic',
                                    style:{ background:'#2E59F4', color:'#fff', fontWeight:800, fontSize:14, fontFamily:'Assistant,sans-serif', padding:'12px 20px', borderRadius:12, textDecoration:'none',
                                        textAlign:'center', lineHeight:1.2, minHeight:44, display:'flex', alignItems:'center' }
                                }, 'להמשיך ←')
                            )
                        ),
                        document.body
                    )}
                </div>
            );
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  DIAGNOSTIC SCREEN                                     ║
        // ╚══════════════════════════════════════════════════════╝
        const DiagnosticScreen = ({ leadData, setLeadData, navigate, route }) => {
            const DS = {
                panel: { maxWidth:640, margin:'0 auto', padding:'24px 16px', width:'100%' },
                field: { width:'100%', background:'#1A2238', border:'1px solid #26304D', borderRadius:10, padding:'12px 14px', color:'#F4F6FC', fontSize:15, fontFamily:'Assistant,sans-serif', outline:'none', boxSizing:'border-box' },
                fieldErr: { borderColor:'#FF8F85' },
                chip: { display:'inline-flex', alignItems:'center', gap:6, padding:'8px 16px', borderRadius:100, border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', fontSize:14, cursor:'pointer', fontFamily:'Assistant,sans-serif', transition:'all 0.15s' },
                chipSel: { borderColor:'#4282FA', background:'rgba(66,130,250,0.14)', color:'#7FA6FF' },
                card: { display:'flex', flexDirection:'column', gap:4, padding:'16px 20px', borderRadius:16, border:'1px solid #26304D', background:'#141A2E', cursor:'pointer', textAlign:'right', transition:'all 0.15s' },
                cardSel: { borderColor:'#4282FA', background:'rgba(66,130,250,0.14)' },
                btn: { display:'inline-flex', alignItems:'center', justifyContent:'center', minHeight:52, padding:'0 32px', borderRadius:14, background:'#2E59F4', color:'#FFFFFF', fontFamily:'Assistant,sans-serif', fontSize:16, fontWeight:800, border:'none', cursor:'pointer', boxShadow:'0 12px 32px rgba(46,89,244,0.35)', transition:'background 0.2s', width:'100%' },
                btnSec: { display:'inline-flex', alignItems:'center', justifyContent:'center', minHeight:44, padding:'0 24px', borderRadius:12, background:'transparent', color:'#A9B7DE', fontFamily:'Assistant,sans-serif', fontSize:14, fontWeight:600, border:'1px solid #26304D', cursor:'pointer', transition:'all 0.15s' },
                err: { color:'#FF8F85', fontSize:13, marginTop:4 },
                label: { display:'block', marginBottom:8, color:'#F4F6FC', fontSize:15, fontWeight:700, fontFamily:'Assistant,sans-serif' },
                hint: { color:'#6B7BA0', fontSize:13, marginTop:4, marginBottom:4 },
                echo: { color:'#A9B7DE', fontSize:13, marginTop:8, fontStyle:'italic' },
                ttl: { margin:0, fontFamily:'Rubik,sans-serif', fontWeight:800, fontSize:'clamp(22px, 4.5vw, 30px)', lineHeight:1.3, color:'#F4F6FC' },
                lead: { margin:'4px 0 20px', fontSize:15, lineHeight:1.6, color:'#A9B7DE' },
                bridge: { fontSize:14, lineHeight:1.6, color:'#A9B7DE', padding:'12px 16px', background:'#141A2E', borderRadius:12, borderRight:'3px solid #4282FA', marginBottom:16 },
            };
            const [ans, setAns] = useState(function() {
                try { var d = sessionStorage.getItem('diagState'); return d ? JSON.parse(d).ans || {} : {}; } catch(e) { return {}; }
            });
            const [curId, setCurId] = useState(function() {
                try { var d = sessionStorage.getItem('diagState'); return d ? JSON.parse(d).curId || null : null; } catch(e) { return null; }
            });
            const [errs, setErrs] = useState({});
            const [editing, setEditing] = useState(null);
            const [tagDrafts, setTagDrafts] = useState({});
            const [dmOk, setDmOk] = useState(false);
            const [isSummary, setIsSummary] = useState(false);
            const [diagZoom, setDiagZoom] = useState(null);

            var prior = React.useMemo(function() { return buildDiagPrior(leadData); }, []);
            var get = function(id) { return diagOwn(ans, id) && ans[id] != null && ans[id] !== '' ? ans[id] : (diagFilled(prior, id) ? prior[id] : undefined); };
            var ipri = function(id) { return diagFilled(prior, id); };
            var type = get('type'), stage = get('stage');
            var ctx = { get:get, inPrior:ipri, type:type, stage:stage, isActive:stage==='active', isIdea:stage==='idea', hasContact:!!(get('name')&&get('phone')&&get('email')) };

            var vs = DIAG_STEPS.filter(function(s) { return !s.show || s.show(ctx); });
            var ns = vs.filter(function(s) { return s.numbered; });
            var si = curId ? vs.findIndex(function(s) { return s.id === curId; }) : 0;
            if (si < 0) si = 0;
            var st = vs[si];
            var ni = st && st.numbered ? ns.indexOf(st) : -1;
            var vq = st && st.questions ? st.questions.filter(function(q) { return !q.show || q.show(ctx); }) : [];

            var setA = function(id, v) { setAns(function(p) { var n = Object.assign({}, p); n[id] = v; return n; }); };
            var toggleArr = function(id, v) { setAns(function(p) { var a = p[id] || []; var n = Object.assign({}, p); n[id] = a.indexOf(v) >= 0 ? a.filter(function(x){ return x !== v; }) : a.concat([v]); return n; }); };

            useEffect(function() {
                try { sessionStorage.setItem('diagState', JSON.stringify({ ans:ans, curId:curId })); } catch(e) {}
            }, [ans, curId]);

            useEffect(function() {
                sendToSheets('diagnostic', leadData, { event: 'diagnostic-start' });
                if (window.gtag) gtag('event', 'diagnostic_start');
            }, []);

            useEffect(function() {
                var m = route && route.match(/^#\/diagnostic\/(\d+)$/);
                if (m) {
                    var stepNum = parseInt(m[1]) - 1;
                    if (stepNum >= 0 && stepNum < vs.length) {
                        var targetId = vs[stepNum].id;
                        if (targetId !== curId) { setCurId(targetId); setIsSummary(false); }
                    } else if (stepNum === vs.length) {
                        if (!isSummary) setIsSummary(true);
                    }
                } else if (route === '#/diagnostic') {
                    if (curId) {
                        var idx = vs.findIndex(function(s) { return s.id === curId; });
                        if (idx >= 0) navigate('#/diagnostic/' + (idx + 1));
                        else navigate('#/diagnostic/1');
                    } else {
                        navigate('#/diagnostic/1');
                    }
                }
            }, [route]);

            var validate = function() {
                if (!st) return true;
                if (st.kind === 'details') {
                    var e = {};
                    if (!get('name') || !get('name').trim()) e.name = true;
                    if (!get('email') || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(get('email'))) e.email = true;
                    if (!get('phone') || diagDigits(get('phone')).length < 9) e.phone = true;
                    setErrs(e); return Object.keys(e).length === 0;
                }
                var e = {};
                vq.forEach(function(q) { if (q.required && !diagIsAnswered(q, get(q.id), ctx)) e[q.id] = true; });
                setErrs(e); return Object.keys(e).length === 0;
            };
            var goNext = function() {
                if (!validate()) return;
                sendToSheets('diagnostic', leadData, { event: 'diag-step-' + (si + 1) + '-' + st.id });
                if (window.gtag) gtag('event', 'diagnostic_step', { step_number: si + 1, step_id: st.id });
                sendWebhook(WEBHOOK_URL, { event:'diagStep', step:st.id, answers:diagClone(ans), lead_id:leadData.lead_id });
                if (si >= vs.length - 1) { setIsSummary(true); navigate('#/diagnostic/' + (vs.length + 1)); window.scrollTo(0,0); return; }
                setErrs({}); navigate('#/diagnostic/' + (si + 2)); window.scrollTo(0, 0);
            };
            var goBack = function() {
                if (isSummary) { setIsSummary(false); navigate('#/diagnostic/' + vs.length); return; }
                if (si > 0) { setErrs({}); navigate('#/diagnostic/' + si); window.scrollTo(0, 0); }
            };
            var pay = function() {
                sendWebhook(WEBHOOK_URL, { event:'diagComplete', answers:diagClone(ans), leadData:leadData });
                sendToSheets('diagnostic', leadData, { diagAnswers: diagClone(ans) });
                setLeadData(function(p) { return Object.assign({}, p, ans, { diagComplete:true }); });
                window.location.href = DIAG_UPAY;
            };

            var renderQ = function(q) {
                var v = get(q.id), hasErr = !!errs[q.id];
                var lbl = (ctx.isIdea && q.labelIdea) || q.label;
                var opts = q.options ? diagNormOpts(q) : [];
                var echoText = q.echo && diagIsAnswered(q, v, ctx) ? q.echo(v) : null;
                var errText = hasErr ? (q.errMsg ? q.errMsg(ctx) : 'שדה חובה') : null;
                var qh = q.hint;

                var wrapQ = function(children) {
                    return (
                        <div key={q.id} style={{ marginBottom:20 }}>
                            <label style={DS.label}>{lbl}</label>
                            {qh && <div style={DS.hint}>{qh}</div>}
                            <div style={{ marginTop:8 }}>{children}</div>
                            {errText && <div style={DS.err}>{errText}</div>}
                            {echoText && <div style={DS.echo}>{echoText}</div>}
                        </div>
                    );
                };

                if (q.type === 'choice') {
                    if (q.cards) {
                        return wrapQ(
                            <div style={{ display:'grid', gridTemplateColumns: q.stack ? '1fr' : 'repeat(auto-fit, minmax(240px, 1fr))', gap:12 }}>
                                {opts.map(function(o) { return (
                                    <button key={o.v} type="button" onClick={function(){ setA(q.id, o.v); }} style={Object.assign({}, DS.card, v === o.v ? DS.cardSel : {})}>
                                        <span style={{ fontSize:15, fontWeight:700, color: v === o.v ? '#7FA6FF' : '#F4F6FC' }}>{o.l}</span>
                                        {o.d && <span style={{ fontSize:13, color:'#A9B7DE' }}>{o.d}</span>}
                                    </button>
                                ); })}
                            </div>
                        );
                    }
                    return wrapQ(
                        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                            {opts.map(function(o) { return (
                                <button key={o.v} type="button" onClick={function(){ setA(q.id, o.v); }} style={Object.assign({}, DS.chip, v === o.v ? DS.chipSel : {})}>{o.l}</button>
                            ); })}
                        </div>
                    );
                }
                if (q.type === 'multi') {
                    var arr = v || [];
                    return wrapQ(
                        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                            {opts.map(function(o) { var ov = o.v || o.l; var sel = arr.indexOf(ov) >= 0; return (
                                <button key={ov} type="button" onClick={function(){ if (q.max && arr.length >= q.max && !sel) return; toggleArr(q.id, ov); }}
                                    style={Object.assign({}, DS.chip, sel ? DS.chipSel : {})}>{o.l}</button>
                            ); })}
                        </div>
                    );
                }
                if (q.type === 'sequence') {
                    var arr = v || [];
                    return wrapQ(
                        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                            {opts.map(function(o) { var ov = o.v || o.l; var idx = arr.indexOf(ov); var sel = idx >= 0; return (
                                <button key={ov} type="button" onClick={function(){ toggleArr(q.id, ov); }}
                                    style={Object.assign({}, DS.chip, sel ? DS.chipSel : {}, { position:'relative', paddingRight: sel ? 32 : 16 })}>
                                    {sel && <span style={{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)', background:'#4282FA', color:'#fff', borderRadius:'50%', width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700 }}>{idx+1}</span>}
                                    {o.l}
                                </button>
                            ); })}
                        </div>
                    );
                }
                if (q.type === 'text') {
                    return wrapQ(
                        <input type="text" value={v || ''} onChange={function(e){ setA(q.id, e.target.value); }} placeholder={q.placeholder || ''}
                            style={Object.assign({}, DS.field, hasErr ? DS.fieldErr : {})} />
                    );
                }
                if (q.type === 'products') {
                    var prods = v || [{ name:'', price:'' }];
                    var setP = function(idx, key, val) { var next = prods.map(function(p,i){ return i===idx ? Object.assign({}, p, (function(){ var o={}; o[key]=val; return o; })()) : p; }); setA(q.id, next); };
                    var addP = function() { if (prods.length < 3) setA(q.id, prods.concat([{ name:'', price:'' }])); };
                    var rmP = function(idx) { setA(q.id, prods.filter(function(_,i){ return i !== idx; })); };
                    return wrapQ(
                        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                            {prods.map(function(p, i) { return (
                                <div key={i} style={{ display:'flex', gap:8, alignItems:'center' }}>
                                    <input type="text" value={p.name || ''} onChange={function(e){ setP(i, 'name', e.target.value); }} placeholder="שם המוצר/שירות"
                                        style={Object.assign({}, DS.field, { flex:2 })} />
                                    <input type="number" value={p.price || ''} onChange={function(e){ setP(i, 'price', e.target.value); }} placeholder="מחיר ₪"
                                        style={Object.assign({}, DS.field, { flex:1 })} />
                                    {i > 0 && <button type="button" onClick={function(){ rmP(i); }} style={{ background:'none', border:'none', color:'#FF8F85', cursor:'pointer', fontSize:18, padding:4 }}>×</button>}
                                </div>
                            ); })}
                            {prods.length < 3 && <button type="button" onClick={addP} style={Object.assign({}, DS.btnSec, { alignSelf:'flex-start' })}>+ הוסף מוצר</button>}
                        </div>
                    );
                }
                if (q.type === 'tags') {
                    var tv = v || { items:[], none:false };
                    var addTag = function() { var d = (tagDrafts[q.id] || '').trim(); if (!d) return; setA(q.id, { items:tv.items.concat([d]), none:false }); setTagDrafts(function(p){ var n=Object.assign({},p); n[q.id]=''; return n; }); };
                    var rmTag = function(idx) { setA(q.id, Object.assign({}, tv, { items:tv.items.filter(function(_,i){ return i !== idx; }) })); };
                    return wrapQ(
                        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                            {tv.items.length > 0 && (
                                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                                    {tv.items.map(function(t, i) { return (
                                        <span key={i} style={Object.assign({}, DS.chip, DS.chipSel, { paddingLeft:8 })}>
                                            {t} <button type="button" onClick={function(){ rmTag(i); }} style={{ background:'none', border:'none', color:'#7FA6FF', cursor:'pointer', marginRight:4, fontSize:14 }}>×</button>
                                        </span>
                                    ); })}
                                </div>
                            )}
                            {!tv.none && (
                                <div style={{ display:'flex', gap:8 }}>
                                    <input type="text" value={tagDrafts[q.id] || ''} onChange={function(e){ setTagDrafts(function(p){ var n=Object.assign({},p); n[q.id]=e.target.value; return n; }); }}
                                        onKeyDown={function(e){ if (e.key === 'Enter') { e.preventDefault(); addTag(); } }}
                                        placeholder={q.placeholder} style={Object.assign({}, DS.field, { flex:1 })} />
                                    <button type="button" onClick={addTag} style={DS.btnSec}>+</button>
                                </div>
                            )}
                            {q.noneLabel && (
                                <label style={{ display:'flex', alignItems:'center', gap:8, color:'#A9B7DE', fontSize:14, cursor:'pointer' }}>
                                    <input type="checkbox" checked={tv.none} onChange={function(e){ setA(q.id, { items:[], none:e.target.checked }); }}
                                        style={{ accentColor:'#4282FA' }} />
                                    {q.noneLabel}
                                </label>
                            )}
                        </div>
                    );
                }
                if (q.type === 'money') {
                    var mv = v || { value:'', unsure:false };
                    return wrapQ(
                        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                            {!mv.unsure && (
                                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                                    <input type="number" value={mv.value} onChange={function(e){ setA(q.id, Object.assign({}, mv, { value:e.target.value })); }}
                                        placeholder={q.placeholder} style={Object.assign({}, DS.field, { flex:1 }, hasErr ? DS.fieldErr : {})} />
                                    <span style={{ color:'#A9B7DE', fontSize:14 }}>₪{q.suffix || ''}</span>
                                </div>
                            )}
                            {q.unsureLabel && (
                                <label style={{ display:'flex', alignItems:'center', gap:8, color:'#A9B7DE', fontSize:14, cursor:'pointer' }}>
                                    <input type="checkbox" checked={mv.unsure} onChange={function(e){ setA(q.id, { value:'', unsure:e.target.checked }); }}
                                        style={{ accentColor:'#4282FA' }} />
                                    {q.unsureLabel}
                                </label>
                            )}
                        </div>
                    );
                }
                if (q.type === 'dims') {
                    var dv = v || { l:'', w:'', h:'', kg:'', unsure:false };
                    var setD = function(k, val) { var n = Object.assign({}, dv); n[k] = val; setA(q.id, n); };
                    var dimFields = [['l','אורך','ס״מ'],['w','רוחב','ס״מ'],['h','גובה','ס״מ'],['kg','משקל','ק״ג']];
                    return wrapQ(
                        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                            {!dv.unsure && (
                                <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:8 }}>
                                    {dimFields.map(function(df) { var k=df[0], dlbl=df[1], u=df[2]; return (
                                        <div key={k} style={{ display:'flex', flexDirection:'column', gap:4 }}>
                                            <span style={{ color:'#6B7BA0', fontSize:12 }}>{dlbl}</span>
                                            <input type="number" value={dv[k]} onChange={function(e){ setD(k, e.target.value); }}
                                                style={Object.assign({}, DS.field, { padding:'8px 10px' }, hasErr ? DS.fieldErr : {})} />
                                            <span style={{ color:'#6B7BA0', fontSize:11 }}>{u}</span>
                                        </div>
                                    ); })}
                                </div>
                            )}
                            <label style={{ display:'flex', alignItems:'center', gap:8, color:'#A9B7DE', fontSize:14, cursor:'pointer' }}>
                                <input type="checkbox" checked={dv.unsure} onChange={function(e){ setA(q.id, { l:'',w:'',h:'',kg:'', unsure:e.target.checked }); }}
                                    style={{ accentColor:'#4282FA' }} />
                                אשלים אחר כך
                            </label>
                        </div>
                    );
                }
                return null;
            };

            var proofQuiet = function(stepId) {
                var sp = DIAG_STEP_PROOF[stepId]; if (!sp) return null;
                if (sp[0] === 'stripe') {
                    var picks = DIAG_STRIPE_PICKS[type] || DIAG_STRIPE_PICKS.service;
                    var item = TM_STRIPE_ITEMS[picks[sp[1]]]; if (!item) return null;
                    var isOpen = diagZoom && diagZoom.img === item.img;
                    return (
                        <div>
                            <div onClick={function(){ setDiagZoom(isOpen ? null : item); }}
                                style={{ display:'flex', gap:12, alignItems:'center', padding:'12px 16px', background:'#141A2E', borderRadius:12, border:'1px solid ' + (isOpen ? '#2E59F4' : '#26304D'), marginTop:16, cursor:'pointer', transition:'border-color 0.2s' }}>
                                <img src={item.img} alt="" style={{ width:60, height:26, borderRadius:6, objectFit:'cover', border:'1px solid #26304D' }} />
                                <div style={{ flex:1 }}>
                                    <div style={{ color:'#F4F6FC', fontSize:14, fontWeight:700, fontFamily:'Rubik,sans-serif' }}>${item.amount.toLocaleString('en-US')}</div>
                                    <div style={{ color:'#6B7BA0', fontSize:12 }}>{item.name}</div>
                                </div>
                                <span style={{ color:'#6B7BA0', fontSize:12 }}>{isOpen ? 'סגירה' : 'הגדלה'}</span>
                            </div>
                            {isOpen && (
                                <div style={{ width:'100%', marginTop:8, borderRadius:16, background:'#141A2E', border:'1px solid #2E59F4', padding:'16px 16px 20px', position:'relative' }}>
                                    <button type="button" onClick={function(){ setDiagZoom(null); }}
                                        style={{ position:'absolute', top:12, left:12, width:32, height:32, borderRadius:'50%', background:'rgba(255,255,255,0.1)', border:'none', color:'#fff', fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1 }}
                                        aria-label="סגירה">✕</button>
                                    <div style={{ textAlign:'right', marginBottom:10 }}>
                                        <div style={{ fontSize:15, fontWeight:700, color:'#F4F6FC' }}>{item.name}</div>
                                        <div style={{ fontSize:13, color:'#A9B7DE' }}>${item.amount.toLocaleString('en-US')} · {item.month}</div>
                                    </div>
                                    <img src={item.img} alt={'צילום מסך מ-Stripe: '+item.name}
                                        style={{ width:'100%', borderRadius:12, background:'#fff', border:'1px solid #26304D' }}/>
                                    <p style={{ textAlign:'center', fontSize:11, color:'#6B7BA0', marginTop:8, marginBottom:0 }}>צילום המסך המקורי מחשבון Stripe של הלקוח.</p>
                                </div>
                            )}
                        </div>
                    );
                }
                if (sp[0] === 'quote') {
                    var qt = DIAG_QUOTES[sp[1]]; if (!qt) return null;
                    return (
                        <div style={{ display:'flex', gap:12, alignItems:'flex-start', padding:'12px 16px', background:'#141A2E', borderRadius:12, border:'1px solid #26304D', marginTop:16 }}>
                            <img src={qt.img} alt={qt.name} style={{ width:40, height:40, borderRadius:'50%', objectFit:'cover', flexShrink:0 }} />
                            <div>
                                <div style={{ color:'#F4F6FC', fontSize:13, lineHeight:1.5 }}>"{qt.q}"</div>
                                <div style={{ color:'#6B7BA0', fontSize:12, marginTop:4 }}>— {qt.name}</div>
                            </div>
                        </div>
                    );
                }
                return null;
            };

            var proofFull = function() {
                var picks = DIAG_STRIPE_PICKS[type] || DIAG_STRIPE_PICKS.service;
                return (
                    <div style={{ display:'flex', flexDirection:'column', gap:20, padding:'24px 0' }}>
                        <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:'6px 16px', padding:'0 16px', fontSize:13, color:'#C9D2EC', fontWeight:600 }}>
                            {DIAG_TRUST.map(function(t, i) { return (
                                <span key={i} style={{ color:'#C9D2EC' }}>{i===0?'★':'✓'} {t[0]} {t[1]}</span>
                            ); })}
                        </div>
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                            {picks.map(function(idx, i) { var item = TM_STRIPE_ITEMS[idx]; if (!item) return null; var isOpen = diagZoom && diagZoom.img === item.img; return (
                                <div key={i}>
                                    <div onClick={function(){ setDiagZoom(isOpen ? null : item); }}
                                        style={{ padding:12, background:'#141A2E', borderRadius:12, border:'1px solid ' + (isOpen ? '#2E59F4' : '#26304D'), cursor:'pointer', transition:'border-color 0.2s' }}>
                                        <img src={item.img} alt="" style={{ width:'100%', borderRadius:8, marginBottom:8 }} />
                                        <div style={{ color:'#F4F6FC', fontSize:14, fontWeight:700, fontFamily:'Rubik,sans-serif' }}>${item.amount.toLocaleString('en-US')}</div>
                                        <div style={{ color:'#6B7BA0', fontSize:12 }}>{item.name}</div>
                                    </div>
                                    {isOpen && (
                                        <div style={{ marginTop:8, borderRadius:16, background:'#141A2E', border:'1px solid #2E59F4', padding:'16px 16px 20px', position:'relative' }}>
                                            <button type="button" onClick={function(e){ e.stopPropagation(); setDiagZoom(null); }}
                                                style={{ position:'absolute', top:12, left:12, width:32, height:32, borderRadius:'50%', background:'rgba(255,255,255,0.1)', border:'none', color:'#fff', fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1 }}
                                                aria-label="סגירה">✕</button>
                                            <div style={{ textAlign:'right', marginBottom:10 }}>
                                                <div style={{ fontSize:15, fontWeight:700, color:'#F4F6FC' }}>{item.name}</div>
                                                <div style={{ fontSize:13, color:'#A9B7DE' }}>${item.amount.toLocaleString('en-US')} · {item.month}</div>
                                            </div>
                                            <img src={item.img} alt={'צילום מסך מ-Stripe: '+item.name}
                                                style={{ width:'100%', borderRadius:12, background:'#fff', border:'1px solid #26304D' }}/>
                                            <p style={{ textAlign:'center', fontSize:11, color:'#6B7BA0', marginTop:8, marginBottom:0 }}>צילום המסך המקורי מחשבון Stripe של הלקוח.</p>
                                        </div>
                                    )}
                                </div>
                            ); })}
                        </div>
                        <div style={{ display:'flex', gap:12, alignItems:'flex-start', padding:16, background:'#141A2E', borderRadius:12, border:'1px solid #26304D' }}>
                            <img src={DIAG_QUOTES.daniel.img} alt={DIAG_QUOTES.daniel.name} style={{ width:48, height:48, borderRadius:'50%', objectFit:'cover', flexShrink:0 }} />
                            <div>
                                <div style={{ color:'#F4F6FC', fontSize:14, lineHeight:1.5 }}>"{DIAG_QUOTES.daniel.q}"</div>
                                <div style={{ color:'#6B7BA0', fontSize:13, marginTop:4 }}>— {DIAG_QUOTES.daniel.name}</div>
                            </div>
                        </div>
                    </div>
                );
            };

            var knownCard = function() {
                var fields = DIAG_KNOWN.filter(function(id) {
                    var q = DIAG_Q[id];
                    return q && (diagFilled(ans, id) || diagFilled(prior, id)) && (!q.show || q.show(ctx));
                });
                if (fields.length === 0) return null;
                return (
                    <div style={{ padding:'16px 20px', background:'#141A2E', borderRadius:16, border:'1px solid #26304D', marginBottom:20 }}>
                        <div style={{ fontSize:13, fontWeight:700, color:'#6B7BA0', marginBottom:12 }}>מה שכבר סיפרת</div>
                        {fields.map(function(id) {
                            var q = DIAG_Q[id], val = get(id);
                            if (editing === id) {
                                return (
                                    <div key={id} style={{ marginBottom:8 }}>
                                        <div style={{ fontSize:12, color:'#6B7BA0', marginBottom:4 }}>{q.short || q.label}</div>
                                        {renderQ(q)}
                                        <button type="button" onClick={function(){ setEditing(null); }} style={Object.assign({}, DS.btnSec, { marginTop:8, fontSize:13 })}>סיום עריכה</button>
                                    </div>
                                );
                            }
                            return (
                                <div key={id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 0', borderBottom:'1px solid #1A2238' }}>
                                    <div>
                                        <div style={{ fontSize:12, color:'#6B7BA0' }}>{q.short || q.label}</div>
                                        <div style={{ fontSize:14, color:'#F4F6FC' }}>{diagPretty(q, val, ctx)}</div>
                                    </div>
                                    <button type="button" onClick={function(){ setEditing(id); }} style={{ background:'none', border:'none', color:'#4282FA', fontSize:13, cursor:'pointer', fontFamily:'Assistant,sans-serif' }}>עריכה</button>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            var progressBar = function() {
                if (ni < 0) return null;
                return (
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
                        <span style={{ color:'#6B7BA0', fontSize:13, whiteSpace:'nowrap' }}>שלב {ni+1} מתוך {ns.length}</span>
                        <div style={{ flex:1, height:4, background:'#1A2238', borderRadius:2, overflow:'hidden' }}>
                            <div style={{ width:((ni+1)/ns.length*100)+'%', height:'100%', background:'#4282FA', borderRadius:2, transition:'width 0.3s' }} />
                        </div>
                    </div>
                );
            };

            // DETAILS SCREEN
            if (!isSummary && st && st.kind === 'details') {
                return (
                    <div style={DS.panel}>
                        <h2 style={DS.ttl}>{st.title(ctx)}</h2>
                        <p style={DS.lead}>{st.lead(ctx)}</p>
                        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                            <div style={{ display:'flex', gap:12 }}>
                                <div style={{ flex:1 }}>
                                    <label style={DS.label}>שם פרטי</label>
                                    <input type="text" autoComplete="given-name" value={get('name') || ''} onChange={function(e){ setA('name', e.target.value); }}
                                        style={Object.assign({}, DS.field, errs.name ? DS.fieldErr : {})} />
                                    {errs.name && <div style={DS.err}>שם פרטי חובה</div>}
                                </div>
                                <div style={{ flex:1 }}>
                                    <label style={DS.label}>שם משפחה</label>
                                    <input type="text" autoComplete="family-name" value={get('lastName') || ''} onChange={function(e){ setA('lastName', e.target.value); }}
                                        style={Object.assign({}, DS.field, errs.lastName ? DS.fieldErr : {})} />
                                    {errs.lastName && <div style={DS.err}>שם משפחה חובה</div>}
                                </div>
                            </div>
                            <div>
                                <label style={DS.label}>אימייל</label>
                                <input type="email" value={get('email') || ''} onChange={function(e){ setA('email', e.target.value); }}
                                    style={Object.assign({}, DS.field, errs.email ? DS.fieldErr : {})} />
                                {errs.email && <div style={DS.err}>כתובת אימייל תקינה</div>}
                            </div>
                            <div>
                                <label style={DS.label}>טלפון</label>
                                <input type="tel" value={get('phone') || ''} onChange={function(e){ setA('phone', e.target.value); }}
                                    style={Object.assign({}, DS.field, errs.phone ? DS.fieldErr : {})} />
                                {errs.phone && <div style={DS.err}>מספר טלפון תקין</div>}
                            </div>
                        </div>
                        <button type="button" onClick={goNext} style={Object.assign({}, DS.btn, { marginTop:24 })}>המשך</button>
                    </div>
                );
            }

            // SUMMARY SCREEN
            if (isSummary) {
                var planItems = diagPlan(ctx);
                var resultItems = diagResults(ctx);
                var biz = get('oneLiner') || '';
                return (
                    <div style={DS.panel}>
                        <button type="button" onClick={goBack} style={Object.assign({}, DS.btnSec, { marginBottom:16 })}>← חזרה</button>
                        <h2 style={Object.assign({}, DS.ttl, { marginBottom:8 })}>מה הצוות יבדוק</h2>
                        <p style={Object.assign({}, DS.lead, { marginBottom:16 })}>מכאן הצוות שלנו לוקח: עובר על התשובות ומתחיל לחקור את {biz || 'העסק שלך'} לפני הפגישה.</p>

                        <div style={{ padding:'16px 20px', background:'#141A2E', borderRadius:16, border:'1px solid #26304D', marginBottom:24 }}>
                            <div style={{ fontSize:14, fontWeight:700, color:'#6B7BA0', marginBottom:12 }}>התוכנית</div>
                            <ul style={{ margin:0, padding:'0 16px', listStyle:'disc' }}>
                                {planItems.map(function(item, i) { return <li key={i} style={{ color:'#F4F6FC', fontSize:14, lineHeight:1.6, marginBottom:4 }}>{item}</li>; })}
                            </ul>
                        </div>

                        <h3 style={Object.assign({}, DS.ttl, { fontSize:'clamp(18px, 3.5vw, 24px)', marginBottom:8 })}>מה תצא איתו מהפגישה</h3>
                        <div style={{ padding:'16px 20px', background:'#141A2E', borderRadius:16, border:'1px solid #26304D', marginBottom:24 }}>
                            <ul style={{ margin:0, padding:'0 16px', listStyle:'disc' }}>
                                {resultItems.map(function(item, i) { return <li key={i} style={{ color:'#F4F6FC', fontSize:14, lineHeight:1.6, marginBottom:4 }}>{item}</li>; })}
                            </ul>
                        </div>

                        <div style={{ display:'flex', gap:12, alignItems:'flex-start', padding:16, background:'#141A2E', borderRadius:16, border:'1px solid #26304D', marginBottom:24 }}>
                            <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
                                <div style={{ background:'#2E59F4', borderRadius:'50%', width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:800, fontFamily:'Rubik,sans-serif', fontSize:16 }}>3</div>
                                <span style={{ color:'#A9B7DE', fontSize:13 }}>חודשים</span>
                            </div>
                            <div style={{ flex:1 }}>
                                <div style={{ color:'#F4F6FC', fontSize:13, lineHeight:1.5 }}>"{DIAG_QUOTES.daniel.q}"</div>
                                <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:8 }}>
                                    <img src={DIAG_QUOTES.daniel.img} alt="" style={{ width:28, height:28, borderRadius:'50%', objectFit:'cover' }} />
                                    <span style={{ color:'#6B7BA0', fontSize:12 }}>{DIAG_QUOTES.daniel.name}</span>
                                </div>
                            </div>
                        </div>

                        <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:'6px 16px', padding:'0 16px', fontSize:13, color:'#C9D2EC', fontWeight:600, marginBottom:24 }}>
                            {DIAG_TRUST.map(function(t, i) { return (
                                <span key={i} style={{ color:'#C9D2EC' }}>{i===0?'★':'✓'} {t[0]} {t[1]}</span>
                            ); })}
                        </div>

                        <div style={{ padding:24, background:'#141A2E', borderRadius:20, border:'2px solid #4282FA', textAlign:'center', marginBottom:24 }}>
                            <div style={{ color:'#6B7BA0', fontSize:12, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:8 }}>פגישת אפיון + מחקר שוק</div>
                            <div style={{ color:'#F4F6FC', fontFamily:'Rubik,sans-serif', fontSize:48, fontWeight:800, lineHeight:1, direction:'ltr' }}>₪ 297</div>
                            <div style={{ color:'#A9B7DE', fontSize:14, marginTop:4 }}>+ מע״מ בלבד</div>
                            <div style={{ color:'#6B7BA0', fontSize:12, marginTop:4, textDecoration:'line-through' }}>(במקום 997₪ + מע״מ)</div>
                            <div style={{ color:'#6B7BA0', fontSize:12, marginTop:12 }}>משרדי האקדמיה, התעשייה 15, רעננה</div>
                            <div style={{ color:'#6B7BA0', fontSize:12 }}>שחר פלץ ושמואל מרדכי</div>
                        </div>

                        <label style={{ display:'flex', alignItems:'flex-start', gap:10, marginBottom:24, cursor:'pointer' }}>
                            <input type="checkbox" checked={dmOk} onChange={function(e){ setDmOk(e.target.checked); }}
                                style={{ accentColor:'#4282FA', marginTop:3, width:18, height:18, flexShrink:0 }} />
                            <span style={{ color:'#A9B7DE', fontSize:14, lineHeight:1.5 }}>
                                בפגישה מציגים את הממצאים ואת תוכנית הפריצה, ומחליטים על הצעד הבא. לכן חשוב שכל מי שמקבל איתך החלטות בעסק יהיה בפגישה.
                            </span>
                        </label>

                        <button type="button" onClick={pay} disabled={!dmOk}
                            style={Object.assign({}, DS.btn, { opacity: dmOk ? 1 : 0.4, cursor: dmOk ? 'pointer' : 'not-allowed' })}>
                            לתשלום + מעבר לקביעת פגישה ←
                        </button>
                        <div style={{ textAlign:'center', marginTop:8, color:'#6B7BA0', fontSize:12 }}>תשלום מאובטח דרך UPay</div>
                    </div>
                );
            }

            // STEP SCREEN
            if (!st) return null;
            var isIntro = st.kind === 'intro';
            return (
                <div style={DS.panel}>
                    {si > 0 && <button type="button" onClick={goBack} style={Object.assign({}, DS.btnSec, { marginBottom:16 })}>← חזרה</button>}
                    {progressBar()}
                    {st.bridge && !isIntro && <div style={DS.bridge}>{st.bridge(ctx)}</div>}
                    <h2 style={DS.ttl}>{st.title(ctx)}</h2>
                    {st.lead && <p style={DS.lead}>{st.lead(ctx)}</p>}
                    {isIntro && knownCard()}
                    {vq.map(function(q) { return renderQ(q); })}
                    <button type="button" onClick={goNext} style={Object.assign({}, DS.btn, { marginTop:8 })}>המשך</button>
                    {st.numbered && proofQuiet(st.id)}
                    {isIntro && proofFull()}
                </div>
            );
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  THANK YOU SCREEN                                      ║
        // ╚══════════════════════════════════════════════════════╝
        const ThankYouScreen = ({ leadData }) => {
            useEffect(() => {
                if (typeof fbq === 'function') fbq('track', 'Purchase', { value: 297, currency: 'ILS' });
                sendToSheets('paid', leadData);
            }, []);

            const firstName = leadData.firstName || '';

            const NEXT_STEPS = [
                { icon: '📞', label: 'השלב הבא', value: 'שיחת היכרות טלפונית עם גיל' },
                { icon: '📅', label: 'מתי', value: 'במועד שקבעת ביומן' },
                { icon: '✅', label: 'מה בשיחה', value: 'וידוא נתונים ותיאום פגישת אפיון' },
                { icon: '📖', label: 'מה נשאר אצלך', value: 'חוברת אסטרטגיה מודפסת בפגישה' },
            ];

            return (
                <div className="flex flex-col items-center w-full fade-enter fade-enter-active pb-20 px-4 font-body">
                    <div className="w-full max-w-2xl flex flex-col items-center text-center gap-6 pt-4">

                        {/* Success icon */}
                        <div className="w-20 h-20 rounded-full bg-[#0d2a1a] border-2 border-[#22c55e] flex items-center justify-center">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>

                        <h1 className="text-2xl md:text-4xl font-extrabold text-txt font-heading leading-tight">
                            {firstName ? firstName + ', ' : ''}התשלום בוצע בהצלחה!
                        </h1>
                        <p className="text-txt-sec text-sm md:text-base leading-relaxed max-w-lg">
                            הצוות שלנו כבר מתחיל לעבוד על מחקר השוק והאסטרטגיה שלך. גיל יתקשר אליך במועד שקבעת לשיחת היכרות קצרה ותיאום פגישת האפיון.
                        </p>

                        {/* Meeting details card */}
                        <div className="w-full bg-card border border-card-border rounded-2xl p-6 md:p-8 text-right space-y-4">
                            <div className="flex items-center gap-2 mb-2">
                                <div className="w-8 h-8 rounded-lg bg-[#0d2a1a] flex items-center justify-center">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                                </div>
                                <span className="text-txt font-bold text-sm font-heading">שיחת היכרות עם גיל</span>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {NEXT_STEPS.map(function(item, i) {
                                    return (
                                        <div key={i} className="flex items-start gap-3">
                                            <span className="text-lg shrink-0 mt-0.5">{item.icon}</span>
                                            <div>
                                                <div className="text-txt-note text-[11px]">{item.label}</div>
                                                <div className="text-txt-sec text-sm font-semibold">{item.value}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* WhatsApp CTA */}
                        <a href={WHATSAPP_LINK} target="_blank" rel="noopener noreferrer"
                            className="inline-flex items-center gap-3 border border-card-border rounded-xl px-5 py-4 hover:bg-card transition-colors min-h-[44px]">
                            <img src="public/assets/whatsapp.png" alt="WhatsApp" className="w-8 h-8 shrink-0"/>
                            <span className="text-txt-sec text-sm font-semibold">שאלות? שלח/י הודעה בוואטסאפ לגיל</span>
                        </a>
                    </div>

                    {/* Testimonials */}
                    <div className="w-full mt-12">
                        <TestimonialsSection leadData={leadData}/>
                    </div>

                    {/* More proof */}
                    <div className="w-full mt-10 flex flex-col items-center">
                        <CollapsibleProof leadData={leadData}/>
                    </div>
                </div>
            );
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  APP & ROUTING                                        ║
        // ╚══════════════════════════════════════════════════════╝
        function App() {
            const [route, setRoute] = useState(window.location.hash || '#/');
            const [leadData, setLeadData] = useState(function() {
                try { var s = sessionStorage.getItem('dollarExpress'); return s ? JSON.parse(s) : {}; }
                catch(e) { return {}; }
            });

            var trackRoute = function(hash) {
                if (window.gtag) {
                    var h = hash || window.location.hash || '#/';
                    var title = h.replace('#/', '') || 'landing';
                    gtag('event', 'page_view', { page_title: title, page_location: window.location.href, page_path: h });
                }
                if (window.fbq) fbq('track', 'PageView');
            };

            useEffect(function() {
                var onHash = function() { setRoute(window.location.hash || '#/'); window.scrollTo(0, 0); trackRoute(); };
                window.addEventListener('hashchange', onHash);
                trackRoute();
                return function() { window.removeEventListener('hashchange', onHash); };
            }, []);

            useEffect(function() {
                var p = new URLSearchParams(window.location.search);
                setLeadData(function(prev) { return Object.assign({}, {
                    lead_id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'lid-' + Date.now() + '-' + Math.random().toString(36).slice(2),
                    utm_source: p.get('utm_source') || '',
                    utm_medium: p.get('utm_medium') || '',
                    utm_campaign: p.get('utm_campaign') || '',
                    utm_content: p.get('utm_content') || '',
                    utm_term: p.get('utm_term') || '',
                    fbclid: p.get('fbclid') || '',
                    gclid: p.get('gclid') || '',
                    referrer: document.referrer || '',
                    landing_url: window.location.href,
                }, prev); });
            }, []);

            useEffect(function() {
                try { sessionStorage.setItem('dollarExpress', JSON.stringify(leadData)); } catch(e) {}
            }, [leadData]);

            var navigate = function(hash) { window.location.hash = hash; };

            var handleQuizComplete = function(data) {
                var payload = Object.assign({}, data, { funnel: 'dollar-express' });
                sendWebhook(WEBHOOK_URL, payload);
                sendToSheets('quiz', payload);
                setLeadData(payload);
                navigate('#/potential');
            };

            var renderScreen = function() {
                if (route.startsWith('#/quiz')) {
                    var match = route.match(/^#\/quiz\/(\d+)$/);
                    if (!match) { navigate('#/quiz/1'); return null; }
                    var quizStep = parseInt(match[1]) - 1;
                    if (quizStep < 0 || quizStep >= quizQuestions.length) { navigate('#/quiz/1'); return null; }
                    return React.createElement(QuizScreen, { step: quizStep, leadData: leadData, setLeadData: setLeadData, onComplete: handleQuizComplete, navigate: navigate });
                }
                if (route === '#/potential') {
                    if (!leadData.firstName) { navigate('#/'); return null; }
                    return React.createElement(PotentialScreen, { leadData: leadData, navigate: navigate });
                }
                if (route === '#/vsl') return React.createElement(VSLScreen, { leadData: leadData });
                if (route === '#/diagnostic' || route.startsWith('#/diagnostic/')) return React.createElement(DiagnosticScreen, { leadData: leadData, setLeadData: setLeadData, navigate: navigate, route: route });
                if (route === '#/thank-you') return React.createElement(ThankYouScreen, { leadData: leadData });
                return React.createElement(LandingScreen, { navigate: navigate });
            };

            return (
                <div className="min-h-screen flex flex-col justify-between w-full">
                    <header className="w-full p-6 md:p-8 flex justify-center items-center z-10 relative">
                        <img src={LOGO} alt="Dollar Academy"
                            className="h-16 md:h-24 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] hover:scale-105 transition-transform duration-300 cursor-pointer"
                            onClick={function() { navigate('#/'); }}/>
                    </header>
                    <main className="flex-grow z-20 relative flex flex-col items-center w-full">
                        {renderScreen()}
                    </main>
                    <footer className="w-full flex flex-col items-center text-center p-8 text-white/50 text-xs tracking-wide z-10 relative mt-auto border-t border-white/5">
                        <img src={LOGO} alt="Logo" className="h-10 md:h-12 object-contain mb-4 opacity-40 grayscale hover:opacity-100 hover:grayscale-0 transition-all duration-500"/>
                        <div className="mb-2 w-full text-center" style={{ textAlign:'center' }}>© {new Date().getFullYear()} Dollar Academy. כל הזכויות שמורות.</div>
                        <div className="flex justify-center items-center gap-2 w-full" style={{ textAlign:'center' }}>
                            <a href="https://dollaracademy.co.il/%D7%9E%D7%93%D7%99%D7%A0%D7%99%D7%95%D7%AA-%D7%A4%D7%A8%D7%98%D7%99%D7%95%D7%AA/" target="_blank" rel="noopener noreferrer" className="hover:text-white/80 hover:underline">מדיניות פרטיות</a>
                            <span>|</span>
                            <a href="https://dollaracademy.co.il/%D7%94%D7%A6%D7%94%D7%A8%D7%AA-%D7%A0%D7%92%D7%99%D7%A9%D7%95%D7%AA/" target="_blank" rel="noopener noreferrer" className="hover:text-white/80 hover:underline">הצהרת נגישות</a>
                        </div>
                    </footer>
                </div>
            );
        }

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
