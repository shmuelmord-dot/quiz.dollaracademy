        const formatPhone = (val) => {
            let d = val.replace(/\D/g, '');
            if (d.length > 10) d = d.slice(0, 10);
            if (d.length > 3) return d.slice(0, 3) + '-' + d.slice(3);
            return d;
        };

        const sendWebhook = (url, data) => {
            fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...data, submitted_at: new Date().toISOString() }) })
                .catch(err => console.error('Webhook error:', err));
        };

        const sendToSheets = (stage, leadData, extra) => {
            if (!SHEETS_WEBHOOK) return;
            var payload = {
                phone: leadData.phone || '',
                firstName: leadData.firstName || '',
                lastName: leadData.lastName || '',
                email: leadData.email || '',
                businessType: leadData.businessType || '',
                motivation: leadData.motivation || '',
                revenue: leadData.revenue || '',
                businessDesc: leadData.businessDesc || '',
                score: leadData.score || '',
                stage: stage,
                event: stage,
                utm_source: leadData.utm_source || '',
                utm_medium: leadData.utm_medium || '',
                utm_campaign: leadData.utm_campaign || '',
                utm_content: leadData.utm_content || '',
                utm_term: leadData.utm_term || '',
                fbclid: leadData.fbclid || '',
                gclid: leadData.gclid || '',
                referrer: leadData.referrer || ''
            };
            if (extra) Object.assign(payload, extra);
            var params = new URLSearchParams();
            Object.entries(payload).forEach(function(kv) {
                params.append(kv[0], typeof kv[1] === 'object' ? JSON.stringify(kv[1]) : String(kv[1] != null ? kv[1] : ''));
            });
            fetch(SHEETS_WEBHOOK, { method: 'POST', mode: 'no-cors', body: params })
                .catch(err => console.error('Sheets backup error:', err));
        };

        const calcScore = (biz, rev, desc) => {
            const bizBase = { software: 93, ecommerce: 90, agency: 88, other: 84 };
            const revBonus = { '1m+': 8, '500k-1m': 6, '100-500k': 4, '30-100k': 2, 'under30k': 0 };
            const ct = biz === 'software' ? 'software' : biz === 'ecommerce' ? 'ecommerce' : biz === 'agency' ? 'agency' : 'other';
            const base = bizBase[ct];
            const descLen = (desc || '').length;
            const clarity = descLen > 100 ? 95 : descLen >= 40 ? 85 : 75;
            const raw = base * 0.4 + (85 + (revBonus[rev] || 0)) * 0.35 + clarity * 0.25;
            return Math.min(96, Math.max(84, Math.round(raw)));
        };

        const DollarRain = ({ count = 40, duration = 4000 }) => {
            const [show, setShow] = useState(true);

                delay: Math.random() * 2, size: Math.random() * 2 + 1,

                    ))}

            );

        const GaugeChart = ({ score, onComplete }) => {
            const [cur, setCur] = useState(0);
            useEffect(() => {
                let s = 0; const end = score, inc = end / 137;
                const t = setInterval(() => { s += inc; if (s >= end) { setCur(end); clearInterval(t); if (onComplete) onComplete(); } else setCur(Math.round(s)); }, 16);
                return () => clearInterval(t);
            }, [score]);
            const circ = Math.PI * 100;
            const off = circ - (cur / 100) * circ;
            return (
                <div className="flex flex-col items-center">
                    <svg viewBox="0 0 240 140" className="w-full max-w-[300px]" style={{ direction: 'ltr' }}>
                        <defs><linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor="#2563eb"/><stop offset="50%" stopColor="#3b82f6"/><stop offset="100%" stopColor="#94a3b8"/></linearGradient></defs>
                        <path d="M 20 120 A 100 100 0 0 1 220 120" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="18" strokeLinecap="round"/>
                        <path d="M 20 120 A 100 100 0 0 1 220 120" fill="none" stroke="url(#gG)" strokeWidth="18" strokeLinecap="round"
                            strokeDasharray={circ} strokeDashoffset={off} style={{ transition:'stroke-dashoffset 0.1s linear' }}/>

        const NumbersSpeak = ({ leadData }) => {
            const money = (n) => '$'+n.toLocaleString('en-US');

            const isLike = (cat) => leadCats.includes(cat);
            const firstMatch = TM_STRIPE_ITEMS.findIndex(d => isLike(d.cat));
            const startIdx = firstMatch >= 0 ? firstMatch : 0;
            const [isMobile, setIsMobile] = useState(typeof window!=='undefined' && window.innerWidth < 640);
            useEffect(() => { const h = () => setIsMobile(window.innerWidth < 640); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);

            const [sIdx, setSIdx] = useState(startIdx);
            const [sTimer, setSTimer] = useState(0);
            const [sPaused, setSPaused] = useState(false);
            const [sFlip, setSFlip] = useState(false);
            const [shownAmt, setShownAmt] = useState(TM_STRIPE_ITEMS[startIdx].amount);
            const [mWin, setMWin] = useState(Math.max(0, Math.min(startIdx, TM_STRIPE_ITEMS.length-4)));
            const [inView, setInView] = useState(false);
            const [nsModal, setNsModal] = useState(null);
            const numRef = useRef(null);
            const tickRef = useRef(null);
            const rafRef = useRef(null);
            const reduceMotion = useRef(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
            const shownAmtRef = useRef(shownAmt); shownAmtRef.current = shownAmt;
            const mWinRef = useRef(mWin); mWinRef.current = mWin;
            const sIdxRef = useRef(sIdx); sIdxRef.current = sIdx;

            const n = TM_STRIPE_ITEMS.length;
            const curItem = TM_STRIPE_ITEMS[sIdx];

            const goStripe = (i) => {
                const target = TM_STRIPE_ITEMS[i].amount;
                const nn = TM_STRIPE_ITEMS.length;
                const w = mWinRef.current;
                const newWin = (i<w||i>=w+4) ? Math.max(0,Math.min(i,nn-4)) : w;
                setSIdx(i); setSTimer(0); setSFlip(f=>!f); setMWin(newWin);
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                if (reduceMotion.current) { setShownAmt(target); return; }
                const from = shownAmtRef.current;
                const start = performance.now();
                const step = (now) => {
                    const p = Math.min(1,(now-start)/700);
                    const e = 1-Math.pow(1-p,3);
                    setShownAmt(Math.round(from+(target-from)*e));
                    if (p<1) rafRef.current=requestAnimationFrame(step);
                };
                rafRef.current = requestAnimationFrame(step);
            };
            const goStripeRef = useRef(goStripe); goStripeRef.current = goStripe;

            useEffect(() => { const el = numRef.current; if (!el) return; const obs = new IntersectionObserver(([e]) => setInView(e.isIntersecting), { threshold:0.15 }); obs.observe(el); return () => obs.disconnect(); }, []);
            useEffect(() => {
                if (!inView || sPaused || reduceMotion.current) { if(tickRef.current) clearInterval(tickRef.current); tickRef.current=null; return; }
                tickRef.current = setInterval(() => { setSTimer(prev => { const next = prev + 100; if (next >= 5000) { const ni = (sIdxRef.current+1) % TM_STRIPE_ITEMS.length; goStripeRef.current(ni); return 0; } return next; }); }, 100);
                return () => { if(tickRef.current) clearInterval(tickRef.current); };

                                            <span style={{ fontSize:12, color:'#8A97BE' }}>{TM_STRIPE_CATS[it.cat]}</span>

                            לחצו על עסק כדי לראות את צילום המסך המקורי מ-Stripe. התוצאות משתנות מעסק לעסק.
                        </p>
                    </div>

                    {modal && (
                        <div style={{ position:'fixed', inset:0, zIndex:300, display:'flex', justifyContent:'center', background:'rgba(0,0,0,0.8)', padding:0 }}
                            onClick={function(){ closeModal(); }}
                            className="items-end md:items-center md:p-4">
                            <div style={{ width:'100%', maxWidth:600, background:'#141A2E', padding:'20px 20px 28px', position:'relative' }}
                                onClick={function(e){ e.stopPropagation(); }}
                                className="rounded-t-[20px] md:rounded-2xl">
                                <button type="button" onClick={function(){ closeModal(); }}
                                    style={{ position:'absolute', top:16, left:16, width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.1)', border:'none', color:'#fff', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}
                                    aria-label="סגירה">✕</button>
                                <div style={{ textAlign:'right', marginBottom:12 }}>
                                    <div style={{ fontSize:16, fontWeight:700, color:'#F4F6FC' }}>{modal.type}</div>
                                    <div style={{ fontSize:14, color:'#A9B7DE' }}>{modal.dailyAmount} ביום אחד · {modal.payments} תשלומים</div>
                                </div>
                                <img src={modal.screenshot} alt={'צילום מסך מ-Stripe: מחזור סליקה של '+modal.dailyAmount+' ביום אחד'}
                                    style={{ width:'100%', borderRadius:12, background:'#fff', border:'1px solid #26304D' }}/>
                                <p style={{ textAlign:'center', fontSize:12, color:'#6B7BA0', marginTop:10 }}>צילום המסך המקורי מחשבון Stripe של הלקוח.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  LANDING SCREEN                                       ║
        // ╚══════════════════════════════════════════════════════╝
        const LandingScreen = ({ navigate }) => {
            const [stripeModalOpen, setStripeModalOpen] = useState(false);
            useEffect(() => { if (typeof fbq === 'function') fbq('track', 'ViewContent'); }, []);
            return (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', width:'100%', gap:36 }}>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px 16px 0', width:'100%', maxWidth:720, textAlign:'center', gap:24 }}>
                    <h1 style={{ fontFamily:'Rubik,sans-serif', fontWeight:800, fontSize:'clamp(30px, 7vw, 52px)', lineHeight:1.15, letterSpacing:'-0.01em', color:'#F4F6FC', margin:0, textAlign:'center' }}>
                        הביזנס שלך מוכן ל<span style={{ color:'#2E6BFF' }}>פוטנציאל האין סופי</span> של השוק האמריקאי?
                    </h1>
                    <p style={{ fontSize:'clamp(15px, 3.5vw, 18px)', lineHeight:1.65, color:'#A9B7DE', maxWidth:560, margin:0, textAlign:'center' }}>
                        ענה על שאלון קצר ותבדוק היתכנות ראשונית בחינם לגמרי — האם העסק שלך בכלל מתאים (ומוכן) למגרש של הגדולים?
                    </p>
                    <button onClick={function(){ navigate('#/quiz/1'); }}
                        style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', minHeight:56, padding:'0 36px', borderRadius:100, background:'#2E59F4', color:'#fff', fontFamily:'Rubik,sans-serif', fontSize:'clamp(17px, 4vw, 21px)', fontWeight:800, border:'none', cursor:'pointer', boxShadow:'0 12px 32px rgba(46,89,244,0.35)', transition:'background 0.2s', textAlign:'center' }}>
                        בוא נבדוק את ההיתכנות שלך
                    </button>
                    <TrustStrip/>
                </div>

                <QuoteRotator paused={stripeModalOpen}/>

                <LandingStripeTable onModalChange={setStripeModalOpen}/>

                <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12, padding:'32px 16px 48px', textAlign:'center' }}>
                    <button onClick={function(){ navigate('#/quiz/1'); }}
                        style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', minHeight:56, padding:'0 36px', borderRadius:100, background:'#2E59F4', color:'#fff', fontFamily:'Rubik,sans-serif', fontSize:'clamp(17px, 4vw, 21px)', fontWeight:800, border:'none', cursor:'pointer', boxShadow:'0 12px 32px rgba(46,89,244,0.35)', transition:'background 0.2s', textAlign:'center' }}>
                        בוא נבדוק את ההיתכנות שלך
                    </button>
                    <p style={{ fontSize:12, color:'#6B7BA0', margin:0 }}>בחינם לגמרי. כמה שאלות קצרות.</p>
                </div>
            </div>
        );
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  QUIZ SCREEN                                          ║
        // ╚══════════════════════════════════════════════════════╝
        const QuizScreen = ({ step, leadData, setLeadData, onComplete, navigate }) => {
            const [inputValue, setInputValue] = useState('');
            const [lastNameValue, setLastNameValue] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [picked, setPicked] = useState(null);
            const inputRef = useRef(null);
            const lastNameRef = useRef(null);

            const q = quizQuestions[step];
            const total = quizQuestions.length;
            const pct = Math.round(((step + 1) / total) * 100);

            useEffect(() => {
                setPicked(null);
                if (q.type === 'name') {
                    setInputValue(leadData.firstName || '');
                    setLastNameValue(leadData.lastName || '');
                } else {
                    setInputValue(leadData[q.id] || '');
                }
                setErrorMsg('');
                setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 100);
            }, [step]);

            const handleChoice = (val) => {
                if (picked !== null) return;
                setPicked(val);
                setLeadData(function(prev) { return Object.assign({}, prev, { [q.id]: val }); });
                setTimeout(() => navigate('#/quiz/' + (step + 2)), 300);
            };

            const validate = () => {
                if (q.type === 'name') {
                    if (inputValue.trim().length < 2) { setErrorMsg('נא להזין שם פרטי'); return false; }
                    if (lastNameValue.trim().length < 2) { setErrorMsg('נא להזין שם משפחה'); return false; }
                    return true;
                }
                const val = inputValue.trim();
                if (q.type === 'textarea' && val.length < (q.minLength || 20)) { setErrorMsg('נא לכתוב לפחות ' + (q.minLength||20) + ' תווים'); return false; }
                if (q.id === 'phone') { const d = val.replace(/\D/g, ''); if (d.length !== 10 || !d.startsWith('05')) { setErrorMsg('נא להזין מספר טלפון ישראלי תקין (05X-XXXXXXX)'); return false; } }
                if (q.id === 'email') { if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { setErrorMsg('נא להזין כתובת מייל תקינה'); return false; } }
                return true;
            };

            const handleNext = () => {
                if (!validate()) return;
                setErrorMsg('');
                var updated;
                if (q.type === 'name') {
                    updated = Object.assign({}, leadData, { firstName: inputValue.trim(), lastName: lastNameValue.trim() });
                    sessionStorage.setItem('firstName', inputValue.trim());
                    sessionStorage.setItem('lastName', lastNameValue.trim());
                } else {
                    const val = inputValue.trim();
                    updated = Object.assign({}, leadData, { [q.id]: val });
                }
                setLeadData(updated);
                if (q.id === 'phone') sendToSheets('quiz-partial', updated, { event: 'quiz-step-' + (step + 1) });
                else if (updated.phone) sendToSheets('quiz-partial', updated, { event: 'quiz-step-' + (step + 1) });
                if (window.gtag) gtag('event', 'quiz_step', { step_number: step + 1, question_id: q.id });
                if (step < total - 1) navigate('#/quiz/' + (step + 2));
                else onComplete(updated);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[80vh] p-4 fade-enter fade-enter-active w-full">
                    <div className="glass-panel w-full max-w-2xl p-6 md:p-12 rounded-3xl relative">
                        <div className="mb-8">
                            <div className="flex justify-between items-center text-sm text-white mb-2 font-bold">
                                <span className="text-white/80">שאלה {step+1} מתוך {total}</span>
                                <span className="text-highlight">{pct}%</span>
                            </div>
                            <div style={{ width:'100%', height:7, background:'#222B47', borderRadius:99, overflow:'hidden' }}>
                                <div style={{ width:pct+'%', height:'100%', background:'linear-gradient(270deg, #2E59F4, #7AA6FF)', borderRadius:99 }}/>
                            </div>
                        </div>

                        <div key={step} className="q-enter min-h-[300px] flex flex-col justify-center items-center center-all">
                            {q.id === 'email' && (
                                <div style={{ display:'inline-flex', alignItems:'center', gap:8, border:'1px solid #26304D', borderRadius:100, padding:'8px 20px', marginBottom:20, fontSize:14, color:'#A9B7DE' }}>
                                    <span style={{ display:'inline-block', width:16, height:16, border:'2px solid transparent', borderTopColor:'#9DB8FF', borderRadius:'50%', animation:'spin 1s linear infinite' }}/>
                                    מכינים את מפת הפוטנציאל שלך…
                                </div>
                            )}
                            <h2 className="font-extrabold text-white text-center leading-snug w-full mb-4" style={{ fontSize:'clamp(1.35rem, 5.5vw, 1.875rem)' }}>{q.question}</h2>
                            {q.subtitle && <p style={{ fontSize:15, color:'#A9B7DE', textAlign:'center', marginBottom:24, lineHeight:1.5 }}>{q.subtitle}</p>}

                            {q.type === 'name' ? (
                                <div className="space-y-5 w-full flex flex-col items-center">
                                    <div className="w-full max-w-sm flex gap-3" style={{direction:'rtl'}}>
                                        <input ref={inputRef} type="text" autoComplete="given-name"
                                            value={inputValue} onChange={(e) => setInputValue(e.target.value)}
                                            onKeyDown={(e) => e.key==='Enter' && lastNameRef.current && lastNameRef.current.focus()}
                                            placeholder="שם פרטי"
                                            className="flex-1 bg-white/10 border-2 border-white/30 focus:border-cta focus:bg-white/20 text-white rounded-xl p-4 text-xl transition-colors text-right outline-none"/>
                                        <input ref={lastNameRef} type="text" autoComplete="family-name"
                                            value={lastNameValue} onChange={(e) => setLastNameValue(e.target.value)}
                                            onKeyDown={(e) => e.key==='Enter' && handleNext()}
                                            placeholder="שם משפחה"
                                            className="flex-1 bg-white/10 border-2 border-white/30 focus:border-cta focus:bg-white/20 text-white rounded-xl p-4 text-xl transition-colors text-right outline-none"/>
                                    </div>
                                    {errorMsg && <div className="w-full text-center"><p className="inline-block text-white bg-red-500 px-4 py-2 rounded-full font-bold text-sm shadow-lg">{errorMsg}</p></div>}
                                    <button onClick={handleNext}
                                        className="cta-glow w-full max-w-sm bg-cta text-white font-bold py-4 px-4 rounded-xl hover:bg-blue-600 active:scale-95 transition-all text-base md:text-lg shadow-lg text-center leading-tight">
                                        {q.nextLabel || 'המשך'}
                                    </button>
                                </div>
                            ) : q.type === 'choice' ? (
                                <div className="space-y-4 w-full flex flex-col items-center">
                                    {q.options.map((opt, i) => {
                                        const sel = picked === opt.value;
                                        return (
                                            <button key={i} onClick={() => handleChoice(opt.value)} disabled={picked !== null}
                                                className={'w-full max-w-md text-right p-5 pr-6 border-2 rounded-xl transition-all duration-200 flex items-center justify-between gap-3 text-white '
                                                    + (sel ? 'bg-cta border-cta shadow-[0_0_22px_rgba(37,99,235,0.55)] scale-[1.02]' : 'bg-white/10 border-white/30 hover:border-cta hover:bg-white/20 active:scale-95')}>
                                                <div className="text-lg md:text-xl font-normal">{opt.label}</div>
                                                <span className={'shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center text-sm transition-all duration-300 '
                                                    + (sel ? 'bg-white border-white text-cta scale-100 opacity-100' : 'border-white/40 scale-0 opacity-0')}>✓</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : q.type === 'textarea' ? (
                                <div className="space-y-5 w-full flex flex-col items-center">
                                    <textarea ref={inputRef} value={inputValue} onChange={(e) => setInputValue(e.target.value)}
                                        placeholder={q.placeholder} rows={5}
                                        className="w-full max-w-md bg-white/10 border-2 border-white/30 focus:border-cta focus:bg-white/20 text-white rounded-xl p-4 text-base md:text-lg transition-colors resize-none outline-none"
                                        style={{ textAlign:'right' }}/>
                                    <div className="text-white/40 text-xs text-center" style={{ textAlign:'center' }}>{inputValue.length} / {q.minLength||20} תווים מינימום</div>
                                    {errorMsg && <div className="w-full text-center"><p className="inline-block text-white bg-red-500 px-4 py-2 rounded-full font-bold text-sm shadow-lg">{errorMsg}</p></div>}
                                    <button onClick={handleNext}
                                        disabled={inputValue.trim().length < (q.minLength||20)}
                                        className={'cta-glow w-full max-w-md bg-cta text-white font-bold py-4 px-4 rounded-xl hover:bg-blue-600 active:scale-95 transition-all text-base md:text-lg shadow-lg text-center leading-tight '
                                            + (inputValue.trim().length < (q.minLength||20) ? 'opacity-50 cursor-not-allowed' : '')}>
                                        {q.nextLabel || 'המשך'}
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-5 w-full flex flex-col items-center">
                                    <input ref={inputRef}
                                        type={q.id==='phone'?'text':q.inputType}
                                        inputMode={q.id==='phone'?'numeric':undefined}
                                        autoComplete={q.id==='phone'?'tel':q.id==='email'?'email':'off'}
                                        value={inputValue}
                                        onChange={(e) => q.id==='phone' ? setInputValue(formatPhone(e.target.value)) : setInputValue(e.target.value)}
                                        onKeyDown={(e) => e.key==='Enter' && handleNext()}
                                        placeholder={q.placeholder}
                                        className="w-full max-w-sm bg-white/10 border-2 border-white/30 focus:border-cta focus:bg-white/20 text-white rounded-xl p-4 text-xl transition-colors text-center outline-none"
                                        style={q.id==='phone' ? {direction:'ltr',textAlign:'left'} : undefined}/>
                                    {errorMsg && <div className="w-full text-center"><p className="inline-block text-white bg-red-500 px-4 py-2 rounded-full font-bold text-sm shadow-lg">{errorMsg}</p></div>}
                                    <button onClick={handleNext}
                                        className="cta-glow w-full max-w-sm bg-cta text-white font-bold py-4 px-4 rounded-xl hover:bg-blue-600 active:scale-95 transition-all text-base md:text-lg shadow-lg text-center leading-tight">
                                        {q.nextLabel || 'המשך'}
                                    </button>
                                </div>
                            )}

                            {step > 0 && (
                                <div className="flex justify-center mt-10 w-full">
                                    <button onClick={() => navigate('#/quiz/' + step)} disabled={picked !== null}
                                        className="text-white/60 text-sm font-normal py-2 px-6 rounded-full hover:text-white hover:shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all duration-300">
                                        חזרה
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-8 w-full max-w-2xl px-4">
                        <QuizProof step={step} leadData={leadData}/>
                    </div>
                </div>
            );
        };

        const QuizProof = ({ step, leadData }) => {
            if (step === 3) {
                var sol = TM_BY_ID.sol;
                return (
                    <div style={{ display:'flex', alignItems:'center', gap:12, maxWidth:420, margin:'0 auto' }}>
                        <img src={sol.img} alt="" style={{ width:44, height:44, borderRadius:'50%', objectFit:'cover', flexShrink:0 }} loading="lazy"/>
                        <div>
                            <p style={{ fontSize:14, color:'#A9B7DE', lineHeight:1.55, margin:0 }}>"{sol.quotes[0]}"</p>
                            <span style={{ fontSize:13, fontWeight:700, color:'#4282FA' }}>{sol.name}</span>
                        </div>
                    </div>
                );
            }
            return <TrustStrip/>;
        };

        // ╔══════════════════════════════════════════════════════╗
        // ║  POTENTIAL SCREEN                                     ║
        // ╚══════════════════════════════════════════════════════╝
        const useSpringValue = (target, opts) => {
            const damping = (opts && opts.damping) || 22;
            const stiffness = (opts && opts.stiffness) || 180;
            const delay = (opts && opts.delay) || 0;
            const onComplete = opts && opts.onComplete;
            const ref = useRef({ value: 0, velocity: 0, target: target, raf: null, started: false });
            const [value, setValue] = useState(0);
            useEffect(() => {
                const s = ref.current;
                s.target = target;
                const start = () => {
                    s.started = true;
                    const tick = () => {
                        const force = -stiffness * (s.value - s.target);
                        const dampForce = -damping * s.velocity;
                        s.velocity += (force + dampForce) * 0.016;
                        s.value += s.velocity * 0.016;
                        if (Math.abs(s.value - s.target) < 0.3 && Math.abs(s.velocity) < 0.5) {
                            s.value = s.target;
                            setValue(Math.round(s.target));
                            if (onComplete) onComplete();
                            return;
                        }
                        setValue(Math.round(s.value));
                        s.raf = requestAnimationFrame(tick);
                    };
                    s.raf = requestAnimationFrame(tick);
                };
                const t = setTimeout(start, delay);
                return () => { clearTimeout(t); if (s.raf) cancelAnimationFrame(s.raf); };
            }, [target]);
            return value;
        };

        const BIZ_SHORT = { ecommerce: 'מוצר פיזי', agency: 'שירות, ייעוץ או קורס', software: 'תוכנה / SaaS' };

        const PotentialScreen = ({ leadData, navigate }) => {
            const score = calcScore(leadData.businessType, leadData.revenue, leadData.businessDesc);
            const ct = contentType(leadData.businessType);
            const firstName = leadData.firstName || '';

            const [revealed, setRevealed] = useState(false);
            const [mounted, setMounted] = useState(false);
            const [openPanel, setOpenPanel] = useState(null);
            const [stripeModal, setStripeModal] = useState(null);

            const gaugeScore = useSpringValue(score, { stiffness: 60, damping: 18, delay: 400, onComplete: () => setRevealed(true) });

            useEffect(() => { requestAnimationFrame(() => setMounted(true)); if (typeof fbq === 'function') fbq('track', 'AddToCart'); }, []);

            const subVals = {
                model: { software: 91, ecommerce: 87, agency: 89 }[ct] || 82,
                surge: Math.min(96, score + 2),
            };

            const strokeDashoffset = 251.2 - (251.2 * (gaugeScore / 100));

            const togglePanel = (key) => setOpenPanel(prev => prev === key ? null : key);

            const cards = [
                { key: 'audience', label: 'קהל יעד פוטנציאלי', value: 'פי 34', sub: 'אנשים בארה״ב, מול ישראל', pct: 95, color: '#60a5fa' },
                { key: 'dollar', label: 'פוטנציאל זינוק במחזור', value: subVals.surge + '%', sub: 'מנוע דולר חזק + 0% מע״מ ביצוא', pct: subVals.surge, color: '#3b82f6' },
                { key: 'fit', label: 'התאמת מודל', value: subVals.model + '%', sub: 'היתכנות מוכחת בישראל', pct: subVals.model, color: '#2563eb' },
            ];

            var BARCODE_BP = [3,1,2,1,3,2,1,1,3,1,2,3,1,1,2,1,3,2,1,3,1,2,1,1,3,2,1,3,1,2,1,3,2,1];

            return (
                <div className={'flex flex-col items-center w-full pb-16 apple-enter' + (mounted ? ' apple-enter-active' : '')}>

                    <div className="w-full max-w-4xl mx-auto px-4 py-8 sm:py-12 font-sans">

                        {/* Section A — Title */}
                        <div className={'text-center mb-10 apple-enter' + (mounted ? ' apple-enter-active' : '')}>
                            <h1 className="text-2xl sm:text-4xl font-extrabold text-white leading-tight mb-3" style={{ textAlign:'center', letterSpacing:'-0.02em' }}>
                                {firstName}, לא להתלהב עדיין —<br/>
                                אבל מבדיקה ראשונית נראה שיכול להיות לעסק שלך{' '}
                                <span className="text-highlight">פוטנציאל אמיתי</span> בשוק האמריקאי.
                            </h1>
                            <p className="text-sm sm:text-base text-slate-400 max-w-2xl mx-auto leading-relaxed" style={{ textAlign:'center' }}>
                                לעסק שכבר הוכיח היתכנות בישראל יש בסיס מצוין. להבטיח שזה יעבוד אוטומטית בארה״ב? לא. אבל בדיקת כדאיות מעמיקה היא הצעד המתבקש ביותר כעת.
                            </p>
                        </div>

                        {/* Section B — Gauge Card */}
                        <div className="rounded-3xl p-6 sm:p-10 mb-8 bg-card border border-card-border">

                            <h2 className="text-center text-base sm:text-lg font-bold text-txt mb-6 font-heading">מפת הפוטנציאל הבסיסית שלך לשוק האמריקאי</h2>

                            {/* Half-circle gauge */}
                            <div className="relative flex flex-col items-center justify-center my-4">
                                <svg className="w-64 sm:w-72 h-36 sm:h-40 overflow-visible" viewBox="0 0 100 55" style={{ direction:'ltr' }}>
                                    <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#1e293b" strokeWidth="8" strokeLinecap="round"/>
                                    <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#2E59F4" strokeWidth="8"
                                        strokeDasharray="251.2" strokeDashoffset={strokeDashoffset} strokeLinecap="round"
                                        className="apple-gauge-arc"/>
                                </svg>
                                <div className="absolute top-14 sm:top-16 flex flex-col items-center">
                                    <span className="text-5xl sm:text-6xl font-black text-white" style={{ textAlign:'center', letterSpacing:'-0.04em' }}>{gaugeScore}%</span>
                                    <span className="text-xs sm:text-sm text-slate-300 font-medium mt-1" style={{ textAlign:'center' }}>מדד פוטנציאל פריצה לארה״ב</span>
                                </div>
                            </div>

                            {/* Badge below gauge */}
                            <div className="flex items-center justify-center gap-2 mt-2 mb-6 flex-wrap">

            useEffect(() => {

                    {showOffer && (

                                        <p className="text-highlight text-xs font-semibold">הטבה חד פעמית</p>

                                    </div>

                                    <div className="flex flex-col md:flex-row gap-6 items-start">

                                        </div>

                                        {INFO_FIELDS.map(function(f, i) {
                                            return (
                                                <div key={i}>
                                                    <div className="text-txt-note text-[11px] mb-0.5">{f.label}</div>

                                    <img src="public/da-symbol.png" alt="" className="h-8 md:h-10 w-auto mb-1"/>
                                    <div className="text-txt-note text-[11px] tracking-wider uppercase">כרטיס VIP</div>
                                    <div className="text-txt font-extrabold text-base font-heading">פגישת אפיון + מחקר שוק לפריצת העסק שלך בארה״ב</div>
                                    <div className="text-4xl md:text-5xl font-extrabold text-txt font-heading" style={{ direction:'ltr' }}>₪ 297</div>
