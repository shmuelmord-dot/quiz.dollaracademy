  const [seen, setSeen] = useState(1);
  const [auto, setAuto] = useState(false);
  const [mob, setMob] = useState(false);
  const timerRef = useRef(null);
  const startedRef = useRef(false);
  const secRef = useRef(null);

  const DUR = 4200;
  const durS = (DUR / 1000) + 's';

  const stopTimer = () => { if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; } };
  const startTimer = (fromSel, fromSeen) => {
    stopTimer();
    const s = fromSel !== undefined ? fromSel : undefined;
    timerRef.current = setInterval(() => {
      setSel(prev => {
        if (prev >= 7) {
          stopTimer();
          setSeen(255);
          setAuto(false);
          return 8;
        }
        const next = prev + 1;
        setSeen(sv => sv | (1 << next));
        return next;
      });
    }, DUR);
  };

  const go = (i) => { stopTimer(); setSel(i); setSeen(sv => i === 8 ? 255 : (sv | (1 << i))); setAuto(false); };
  const toggleAuto = () => {
    if (auto) { stopTimer(); setAuto(false); return; }
    setSel(prev => {
      if (prev >= 8) { setSeen(1); setAuto(true); startTimer(0, 1); return 0; }
      setAuto(true); startTimer(prev); return prev;
    });
  };
  const replay = () => { setSel(0); setSeen(1); setAuto(true); startTimer(0, 1); };

  useEffect(() => {
    const mq = window.matchMedia('(max-width:1023px)');

    return () => mq.removeEventListener('change', h);

      if (entry.isIntersecting && !startedRef.current) {
        startedRef.current = true;
        setAuto(true);
        startTimer(0, 1);
      }
    }, { threshold: 0.35 });
    obs.observe(el);
    return () => { stopTimer(); obs.disconnect(); };
  }, []);

  let count = 0;

      };

    const [activeChap, setActiveChap] = useState(0);

    const [vidPlaying, setVidPlaying] = useState(false);
    const [curTime, setCurTime] = useState(5);
    const [isMobile, setIsMobile] = useState(typeof window!=='undefined' && window.innerWidth < 640);
    useEffect(() => { const h = () => setIsMobile(window.innerWidth < 640); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
    const playerRef = useRef(null);
    const pollRef = useRef(null);
    const reduceMotion = useRef(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
    useEffect(() => {
        if (window.YT && window.YT.Player) return;
        if (document.querySelector('script[src*="youtube.com/iframe_api"]')) return;
        const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
    }, []);
    const initPlayer = useRef(false);
    useEffect(() => {
        if (initPlayer.current) return;
        const tryInit = () => {
            if (!window.YT || !window.YT.Player) return;
            initPlayer.current = true; clearInterval(waitId);
            const el = document.getElementById('fd-yt-target');
            if (!el) return;
            playerRef.current = new YT.Player('fd-yt-target', {
                videoId: FEATURED_VIDEO_ID,
                playerVars: { rel:0, modestbranding:1, playsinline:1, showinfo:0, enablejsapi:1 },
                events: { onStateChange: (e) => {
                    const p = e.data === YT.PlayerState.PLAYING; setVidPlaying(p);
                    if (p && !pollRef.current) { pollRef.current = setInterval(() => { if (!playerRef.current||!playerRef.current.getCurrentTime) return; const t=Math.floor(playerRef.current.getCurrentTime()); setCurTime(t); const k=chapAt(t); setActiveChap(prev => { if(prev!==k){setQFlip(f=>!f);return k;} return prev; }); }, 250); }
                    if (!p && pollRef.current) { clearInterval(pollRef.current); pollRef.current=null; }
                }}
            });
        };
        const waitId = setInterval(tryInit, 200); tryInit();
        return () => { clearInterval(waitId); if(pollRef.current) clearInterval(pollRef.current); };
    }, []);
    const jumpTo = (k) => {
        const c = TM_CHAPTERS[k];
        if (playerRef.current && playerRef.current.seekTo) { playerRef.current.seekTo(c.ch.t, true); playerRef.current.playVideo(); }

    };
    const chap = TM_CHAPTERS[activeChap];

        <div style={{ width:'100%', display:'flex', flexDirection:'column', alignItems:'center', padding:isMobile?'0 16px':'0 24px', gap:0 }}>
            <div style={{ position:'relative', width:'100%', maxWidth:1040, marginTop:isMobile?28:44 }}>
                <div style={{ position:'relative', aspectRatio:'16/9', borderRadius:isMobile?18:26, overflow:'hidden', background:'#070A14', border:'1px solid #26304D', boxShadow:'0 40px 120px rgba(46,89,244,0.20),0 24px 60px rgba(0,0,0,0.5)' }}>
                    <div id="fd-yt-target" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}/>
                    {!vidPlaying && <img src={TM_VIDEO_POSTER} alt="" style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover' }}/>}
                    <div style={{ position:'absolute', top:isMobile?12:24, right:isMobile?14:28, display:'flex', flexDirection:'column', gap:isMobile?1:3, zIndex:2 }}>
                        <span style={{ fontFamily:'Rubik,sans-serif', fontSize:isMobile?14:19, fontWeight:700, color:'#F4F6FC' }}>הלקוחות שלנו, במילים שלהם</span>
                        <span style={{ fontSize:isMobile?11:13, color:'#A9B7DE' }}>סרטון ההמלצות של אקדמיית הדולר · 3:22</span>
                    </div>
                    {!vidPlaying && (
                        <button type="button" onClick={()=>{ if(playerRef.current&&playerRef.current.playVideo) playerRef.current.playVideo(); }}
                            aria-label="הפעלת סרטון ההמלצות" className="tm-ring"
                            style={{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', width:isMobile?64:100, height:isMobile?64:100,
                                borderRadius:'50%', border:'none', background:'#2E59F4', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', boxShadow:'0 16px 40px rgba(0,0,0,0.5)', zIndex:3 }}>
                            <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" style={{ marginLeft:5 }}><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
                        </button>
                    )}
                    <div style={{ position:'absolute', right:isMobile?14:28, left:isMobile?14:28, bottom:isMobile?30:54, direction:'ltr', zIndex:2 }}>
                        <div style={{ position:'relative', height:4, borderRadius:2, background:'rgba(244,246,252,0.22)' }}>
                            <div style={{ position:'absolute', left:0, top:0, bottom:0, width:((curTime/TM_VIDEO_DURATION)*100).toFixed(2)+'%', borderRadius:2, background:'#2E59F4' }}/>
                            {TM_CHAPTERS.map((c,i) => (
                                <span key={i} style={{ position:'absolute', top:'50%', left:((c.ch.t/TM_VIDEO_DURATION)*100).toFixed(2)+'%',
                                    width:12, height:12, margin:'-6px 0 0 -6px', borderRadius:'50%',

                        <div style={{ marginTop:8, display:'flex', justifyContent:'space-between', fontSize:12, fontWeight:600, color:'#A9B7DE' }}>
                            <span>{fmt(curTime)}</span><span>3:22</span>
                        </div>
                    </div>
                </div>
                <div style={{ position:'relative', marginTop:isMobile?-18:-34, display:'flex', justifyContent:isMobile?'space-evenly':'center', alignItems:'flex-start', gap:isMobile?0:20, direction:'ltr', padding:isMobile?'0 4px':0 }}>
                    {TM_CHAPTERS.map((c,i) => (

                            <span style={{ fontSize:isMobile?10:13, fontWeight:700, color: i===activeChap?'#F4F6FC':'#8A97BE' }}>{fmt(c.ch.t)}</span>
                        </button>
                    ))}
                </div>
            </div>
            <div style={{ marginTop:isMobile?28:36, width:'100%', maxWidth:840, minHeight:isMobile?0:196, display:'flex', flexDirection:'column', alignItems:'center', gap:18, textAlign:'center' }}>
                {!qFlip ? (

                    </div>
                ) : (
                    <div key="qB" className="tm-swap" style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>

                        <p style={{ margin:0, fontFamily:'Rubik,Assistant,sans-serif', fontSize:isMobile?20:30, fontWeight:700, lineHeight:isMobile?1.5:1.42, color:'#F4F6FC', textWrap:'balance' }}>"{chap.quotes[chap.ch.q]}"</p>
                    </div>

const NumbersSpeak = () => {
    const money = (n) => '$'+n.toLocaleString('en-US');
    const [isMobile, setIsMobile] = useState(typeof window!=='undefined' && window.innerWidth < 1024);
    useEffect(() => { const h = () => setIsMobile(window.innerWidth < 1024); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
    const [sIdx, setSIdx] = useState(0);
    const [sTimer, setSTimer] = useState(0);
    const [sPaused, setSPaused] = useState(false);
    const [sFlip, setSFlip] = useState(false);
    const [shownAmt, setShownAmt] = useState(TM_STRIPE_ITEMS[0].amount);
    const [mWin, setMWin] = useState(0);
    const [inView, setInView] = useState(false);
    const [nsModal, setNsModal] = useState(null);
    const numRef = useRef(null);
    const tickRef = useRef(null);
    const rafRef = useRef(null);
    const reduceMotion = useRef(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
    const shownAmtRef = useRef(shownAmt); shownAmtRef.current = shownAmt;
    const mWinRef = useRef(mWin); mWinRef.current = mWin;
    const sIdxRef = useRef(sIdx); sIdxRef.current = sIdx;
    const n = TM_STRIPE_ITEMS.length;
    const curItem = TM_STRIPE_ITEMS[sIdx];
    const goStripe = (i) => {
        const target = TM_STRIPE_ITEMS[i].amount;
        const w = mWinRef.current;
        const newWin = (i<w||i>=w+4) ? Math.max(0,Math.min(i,n-4)) : w;
        setSIdx(i); setSTimer(0); setSFlip(f=>!f); setMWin(newWin);
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        if (reduceMotion.current) { setShownAmt(target); return; }
        const from = shownAmtRef.current; const start = performance.now();
        const step = (now) => { const p = Math.min(1,(now-start)/700); const e = 1-Math.pow(1-p,3); setShownAmt(Math.round(from+(target-from)*e)); if (p<1) rafRef.current=requestAnimationFrame(step); };
        rafRef.current = requestAnimationFrame(step);
    };
    const goStripeRef = useRef(goStripe); goStripeRef.current = goStripe;
    useEffect(() => { const el = numRef.current; if (!el) return; const obs = new IntersectionObserver(([e]) => setInView(e.isIntersecting), { threshold:0.15 }); obs.observe(el); return () => obs.disconnect(); }, []);
    useEffect(() => {
        if (!inView || sPaused || reduceMotion.current) { if(tickRef.current) clearInterval(tickRef.current); tickRef.current=null; return; }
        tickRef.current = setInterval(() => { setSTimer(prev => { const next = prev + 100; if (next >= 5000) { const ni = (sIdxRef.current+1) % n; goStripeRef.current(ni); return 0; } return next; }); }, 100);
        return () => { if(tickRef.current) clearInterval(tickRef.current); };
    }, [inView, sPaused]);
    useEffect(() => () => { if(rafRef.current) cancelAnimationFrame(rafRef.current); }, []);
    return (
        <section ref={numRef} style={{ width:'100%', maxWidth:1080, display:'flex', flexDirection:'column', alignItems:'center', gap:isMobile?20:28, padding:'0 16px' }}
            onMouseEnter={()=>setSPaused(true)} onMouseLeave={()=>setSPaused(false)}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8, textAlign:'center' }}>
                <h3 style={{ margin:0, fontFamily:'Rubik,sans-serif', fontWeight:800, fontSize:isMobile?28:38, color:'#F4F6FC' }}>המספרים מדברים</h3>
                <p style={{ margin:0, fontSize:17, color:'#A9B7DE' }}>בחרו עסק מהרשימה, או תנו לזה לרוץ.</p>
            </div>
            <div style={{ width:'100%', display:'flex', alignItems:'stretch', gap:24 }}>
                {!isMobile && (
                    <div className="styled-scrollbar" style={{ flex:'0 0 350px', maxHeight:660, overflowY:'auto', padding:8, borderRadius:24, background:'#0F1426', border:'1px solid #1E2742', display:'flex', flexDirection:'column', gap:4 }}>
                        {TM_STRIPE_ITEMS.map((it,i) => (
                            <button key={i} type="button" onClick={()=>goStripe(i)} style={{ flex:'none', width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
                                padding:'12px 14px', borderRadius:14, background:i===sIdx?'#141A2E':'transparent', border:'1px solid '+(i===sIdx?'#2E59F4':'transparent'),
                                color:'#F4F6FC', fontFamily:'Assistant,sans-serif', textAlign:'start', cursor:'pointer' }}>
                                <span style={{ display:'flex', flexDirection:'column', gap:5, minWidth:0 }}>
                                    <span style={{ fontSize:15, fontWeight:700, lineHeight:1.3 }}>{it.name}</span>
                                    <span style={{ fontSize:12, color:'#8A97BE' }}>{TM_STRIPE_CATS[it.cat]}</span>
                                </span>
                                <span style={{ flex:'none', direction:'ltr', fontFamily:'Rubik,sans-serif', fontSize:15, fontWeight:800 }}>{money(it.amount)}</span>
                            </button>
                        ))}
                    </div>
                )}
                <div style={{ flex:'1 1 0', minWidth:0, padding:isMobile?16:26, borderRadius:isMobile?20:24, background:'#141A2E', border:'1px solid #26304D', display:'flex', flexDirection:'column', gap:18 }}>
                    <div style={{ display:'flex', gap:4 }}>
                        {TM_STRIPE_ITEMS.map((_,i) => (
                            <span key={i} style={{ flex:'1 1 0', height:4, borderRadius:2, background:'#1E2742', overflow:'hidden' }}>
                                <span className="tm-seg-fill" style={{ display:'block', height:'100%', width: i<sIdx?'100%':(i===sIdx?Math.min(100,(sTimer/5000)*100).toFixed(1)+'%':'0%'), background:'#2E59F4' }}/>
                            </span>
                        ))}
                    </div>
                    <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:16 }}>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                            <span style={{ fontSize:13, fontWeight:700, color:'#4282FA' }}>{TM_STRIPE_CATS[curItem.cat]}</span>
                            <span style={{ fontFamily:'Rubik,sans-serif', fontSize:isMobile?19:26, fontWeight:800, lineHeight:1.25 }}>{curItem.name}</span>
                        </div>
                    </div>
                    <button type="button" onClick={()=>{setSPaused(true);setNsModal(curItem);}} style={{ cursor:'pointer', border:'none', background:'none', padding:0, width:'100%' }}>
                        {!sFlip ? (
                            <div key={'sA-'+sIdx} className="tm-pop" style={{ borderRadius:16, overflow:'hidden', background:'#FFFFFF', boxShadow:'0 22px 60px rgba(0,0,0,0.45)' }}>
                                <img src={curItem.img} alt={'צילום מסך: '+curItem.name} style={{ width:'100%', aspectRatio:'1200/516', objectFit:'cover' }} loading="lazy"/>
                            </div>
                        ) : (
                            <div key={'sB-'+sIdx} className="tm-pop" style={{ borderRadius:16, overflow:'hidden', background:'#FFFFFF', boxShadow:'0 22px 60px rgba(0,0,0,0.45)' }}>
                                <img src={curItem.img} alt={'צילום מסך: '+curItem.name} style={{ width:'100%', aspectRatio:'1200/516', objectFit:'cover' }} loading="lazy"/>
                            </div>
                        )}
                    </button>
                    <span style={{ marginTop:-8, fontSize:12, color:'#8A97BE' }}>צילום מסך מחשבון Stripe של הלקוח · {curItem.month} · <span style={{ color:'#4282FA', cursor:'pointer' }} onClick={()=>{setSPaused(true);setNsModal(curItem);}}>לחצו להגדלה</span></span>
                    <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'space-between', gap:16 }}>
                        <div style={{ display:'flex', flexWrap:'wrap', alignItems:'baseline', gap:14 }}>
                            <span style={{ direction:'ltr', fontFamily:'Rubik,sans-serif', fontSize:isMobile?36:50, fontWeight:800, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{money(shownAmt)}</span>
                            <span style={{ direction:'ltr', padding:'4px 10px', borderRadius:999, background:'rgba(74,222,128,0.14)', color:'#4ADE80', fontSize:14, fontWeight:700 }}>{curItem.pct}</span>
                            <span style={{ fontSize:14, color:'#A9B7DE' }}>מחזור סליקה ב{curItem.month}</span>
                        </div>
                        <div style={{ display:'flex', gap:10 }}>
                            <button type="button" onClick={()=>goStripe((sIdx+n-1)%n)} aria-label="הקודם" style={{ width:46, height:46, borderRadius:'50%', border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                            <button type="button" onClick={()=>setSPaused(p=>!p)} aria-label={sPaused?'המשך':'עצירה'} style={{ width:46, height:46, borderRadius:'50%', border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
                                {!sPaused ? <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                                : <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>}
                            </button>
                            <button type="button" onClick={()=>goStripe((sIdx+1)%n)} aria-label="הבא" style={{ width:46, height:46, borderRadius:'50%', border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            {isMobile && (
                <div style={{ width:'100%', padding:8, borderRadius:18, background:'#0F1426', border:'1px solid #1E2742', display:'flex', flexDirection:'column', gap:4 }}>
                    {TM_STRIPE_ITEMS.slice(mWin, mWin+4).map((it,i) => {
                        const ri = mWin+i;
                        return (
                            <button key={ri} type="button" onClick={()=>goStripe(ri)} style={{ flex:'none', width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
                                padding:'12px 14px', borderRadius:14, background:ri===sIdx?'#141A2E':'transparent', border:'1px solid '+(ri===sIdx?'#2E59F4':'transparent'),
                                color:'#F4F6FC', fontFamily:'Assistant,sans-serif', textAlign:'start', cursor:'pointer' }}>
                                <span style={{ display:'flex', flexDirection:'column', gap:5, minWidth:0 }}>
                                    <span style={{ fontSize:15, fontWeight:700, lineHeight:1.3 }}>{it.name}</span>
                                    <span style={{ fontSize:12, color:'#8A97BE' }}>{TM_STRIPE_CATS[it.cat]}</span>
                                </span>
                                <span style={{ flex:'none', direction:'ltr', fontFamily:'Rubik,sans-serif', fontSize:15, fontWeight:800 }}>{money(it.amount)}</span>
                            </button>
                        );
                    })}
                    <div style={{ display:'flex', justifyContent:'center', gap:10, padding:'6px 0 2px' }}>
                        <button type="button" onClick={()=>setMWin(w=>Math.max(0,w-4))} aria-label="הקודמים" style={{ width:44, height:44, borderRadius:'50%', border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', opacity:mWin<=0?0.35:1 }}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                        </button>
                        <button type="button" onClick={()=>setMWin(w=>Math.min(n-4,w+4))} aria-label="הבאים" style={{ width:44, height:44, borderRadius:'50%', border:'1px solid #26304D', background:'transparent', color:'#F4F6FC', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', opacity:mWin>=n-4?0.35:1 }}>

                        </button>
                    </div>
                </div>
            )}

            {nsModal && (
                <div style={{ width:'100%', marginTop:8, borderRadius:20, background:'#141A2E', border:'1px solid #2E59F4', padding:'16px 16px 20px', position:'relative' }}>

                    <div style={{ textAlign:'right', marginBottom:10 }}><div style={{ fontSize:15, fontWeight:700 }}>{nsModal.name}</div><div style={{ fontSize:13, color:'#A9B7DE' }}>{money(nsModal.amount)} · {nsModal.month}</div></div>
                    <img src={nsModal.img} alt={'צילום מסך: '+nsModal.name} style={{ width:'100%', borderRadius:12, background:'#fff', border:'1px solid #26304D' }}/>
                    <p style={{ textAlign:'center', fontSize:11, color:'#6B7BA0', marginTop:8, marginBottom:0 }}>צילום המסך המקורי מחשבון Stripe של הלקוח.</p>
                </div>
            )}
        </section>
    );
};
